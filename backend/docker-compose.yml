services:
  # Laravel PHP-FPM Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: safelink-backend-app
    container_name: safelink-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: 1
    working_dir: /var/www
    volumes:
      # Bind source; named volumes keep vendor/cache off the slow Windows FS
      - .:/var/www
      - safelink-vendor:/var/www/vendor
      - safelink-bootstrap-cache:/var/www/bootstrap/cache
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/zz-www.conf:ro
    networks:
      - safelink-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  webserver:
    image: nginx:alpine
    container_name: safelink-webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - safelink-network
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: mysql:8.0
    container_name: safelink-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: safelink_db
      MYSQL_USER: safelink_user
      MYSQL_PASSWORD: safelink_secret
      MYSQL_ROOT_PASSWORD: root_secret
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --innodb-flush-log-at-trx-commit=2
      - --innodb-flush-method=O_DIRECT
      - --skip-log-bin
      - --performance-schema=OFF
      - --max-connections=100
      - --table-open-cache=400
      - --tmp-table-size=32M
      - --max-heap-table-size=32M
    volumes:
      - safelink-db-data:/var/lib/mysql
    networks:
      - safelink-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:alpine
    container_name: safelink-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --tcp-backlog
      - "511"
    networks:
      - safelink-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  safelink-network:
    driver: bridge

volumes:
  safelink-db-data:
  safelink-vendor:
  safelink-bootstrap-cache:

services:
  # Laravel PHP-FPM Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: safelink-backend-app
    container_name: safelink-app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - safelink-network

  # Nginx Web Server Service
  webserver:
    image: nginx:alpine
    container_name: safelink-webserver
    restart: unless-stopped
    tty: true
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - safelink-network
    depends_on:
      - app

  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: safelink-db
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: safelink_db
      MYSQL_USER: safelink_user
      MYSQL_PASSWORD: safelink_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - safelink-db-data:/var/lib/mysql
    networks:
      - safelink-network

  # Redis Cache & Queue Service
  redis:
    image: redis:alpine
    container_name: safelink-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - safelink-network

# Docker Networks
networks:
  safelink-network:
    driver: bridge

# Docker Volumes
volumes:
  safelink-db-data:
    driver: local
